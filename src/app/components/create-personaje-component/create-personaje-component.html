<h1>Nuevo personaje</h1>
<form #form="ngForm">
    Id personaje: 
    <input type="number" #cajaid name="cajaid" class="form-control"/>
    Nombre:
    <input type="text" #cajanombre name="cajanombre" class="form-control"/>
    Imagen:
    <input type="text" #cajaimagen name="cajaimagen" class="form-control"/>
    Id serie
    <input type="number" #cajaidserie name="cajaidserie" class="form-control"/>
    <button (click)="crearPersonaje()" class="btn btn-dark">
        Create
    </button>
</form>
<h2 style="color:blue">{{mensaje}}</h2>
